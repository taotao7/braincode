[test]
coveragePathIgnorePatterns = [
  "apps/cli/src/brain-pet.tsx",
  "apps/cli/src/clipboard.ts",
  "apps/cli/src/doctor.ts",
  "apps/cli/src/image-preview.ts",
  "apps/cli/src/index.ts",
  "apps/cli/src/mcp-health.ts",
  "apps/cli/src/pet-watcher.ts",
  "apps/cli/src/project-files.ts",
  "apps/cli/src/tool-edit-preview.ts",
  "apps/cli/src/tui-components.tsx",
  "apps/cli/src/tui-constants.ts",
  "apps/cli/src/tui-format.ts",
  "apps/cli/src/tui-input.ts",
  "apps/cli/src/tui-paint.ts",
  "apps/cli/src/tui-store.ts",
  "apps/cli/src/tui-text.ts",
  "apps/cli/src/tui-theme.ts",
  "apps/cli/src/tui-tools.ts",
  "apps/cli/src/tui-transcript.ts",
  "apps/cli/src/tui.tsx",
  "packages/agent-runtime/src/mcp-loading.ts",
  "packages/agent-runtime/src/index.ts",
  "packages/agent-runtime/src/mcp.ts",
  "packages/agent-runtime/src/runtime-agent.ts",
  "packages/agent-runtime/src/workers.ts",
  "packages/server/src/index.ts"
]
# Keep this aligned with the current focused unit-test baseline. The ignore list
# excludes interactive entrypoints and orchestration shells that need separate
# integration coverage instead of forcing every smoke-tested file through this
# per-file unit gate.
coverageThreshold = { lines = 0.60, functions = 0.60 }
